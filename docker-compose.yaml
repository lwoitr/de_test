services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: "de_test"
      CLICKHOUSE_USER: "admin99"
      CLICKHOUSE_PASSWORD: "12345f"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init:/docker-entrypoint-initdb.d

volumes:
  clickhouse_data:
